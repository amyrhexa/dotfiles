# ==============================================================================
# TYPOGRAPHY & RENDERING
# ==============================================================================
font_family      IosevkaTerm Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# 110% line height gives Iosevka breathing room; prevents wall-of-text fatigue
# (option names are cell_height/cell_width, not line_height/column_width —
# the previous names are silently ignored by kitty)
modify_font cell_height 110%
modify_font cell_width 100%

# Prevents cursor from jittering when traversing programming ligatures (->, ==)
disable_ligatures cursor

# Render undercurls (used by Neovim for LSP errors/spellcheck)
undercurl_style thin-sparse

# ==============================================================================
# PERFORMANCE & SYSTEM
# ==============================================================================
sync_to_monitor yes
linux_display_server auto

# Fedora's dnf manages the kitty package version; disable kitty's own updater
# so it doesn't nag about releases that dnf hasn't shipped yet.
update_check_interval 0

# ==============================================================================
# INPUT & PROTOCOL INTERCEPTION
# ==============================================================================
# Emits raw ASCII control bytes on key-down to prevent CSI u double-triggering
map enter       send_text all \r
map kp_enter    send_text all \r
map backspace   send_text all \x7f

# ==============================================================================
# NOTIFICATIONS & BELLS
# ==============================================================================
# Never generate desktop notification popups on command termination
notify_on_cmd_finish never

# Disable visual and audio bells
enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab          no
command_on_bell      none

# ==============================================================================
# SCROLLBACK ENGINE & SHELL INTEGRATION
# ==============================================================================
shell_integration enabled
scrollback_lines  20000
scrollback_pager_history_size 64

# ==============================================================================
# MOUSE & INTERACTIVITY
# ==============================================================================
mouse_hide_wait        3.0
focus_follows_mouse    no
copy_on_select         no
strip_trailing_spaces  smart
select_by_word_characters @-./_~?&=%+#:

# ==============================================================================
# WINDOW MANAGEMENT
# ==============================================================================
remember_window_size    no
initial_window_width    75c
initial_window_height   15c
window_padding_width    6
placement_strategy      center
hide_window_decorations yes
confirm_os_window_close -1
wayland_titlebar_color  background

# Splits/tabs: kept off by default (remember_window_size no / single-window
# workflow above), but wired up so ctrl+shift+enter/t are useful the moment
# you want a split or a new tab without losing the current cwd.
enabled_layouts splits,stack
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window

# ==============================================================================
# CURSOR
# ==============================================================================
cursor_shape          beam
cursor_blink_interval 0.5

# ==============================================================================
# COLOR PALETTE: Everforest Dark Medium
# ==============================================================================
background            #2d353b
background_opacity    0.93
foreground            #d3c6aa
cursor                #d3c6aa
cursor_text_color     #2d353b
selection_background  #475258
selection_foreground  #d3c6aa
url_color             #7fbbb3

# Terminal ANSI Colors 0-15
color0  #343f44
color8  #4d5c64
color1  #e67e80
color9  #e67e80
color2  #a7c080
color10 #a7c080
color3  #dbbc7f
color11 #dbbc7f
color4  #7fbbb3
color12 #7fbbb3
color5  #d699b6
color13 #d699b6
color6  #83c092
color14 #83c092
color7  #d3c6aa
color15 #e5dfc5

# Window/tab-bar borders in the same palette, so the splits enabled above
# read as part of the theme rather than kitty's stock blue/gray.
window_border_width   1
active_border_color   #dbbc7f
inactive_border_color #4d5c64
tab_bar_edge          bottom
tab_bar_style         powerline
tab_bar_min_tabs      2
active_tab_foreground   #2d353b
active_tab_background   #a7c080
inactive_tab_foreground #d3c6aa
inactive_tab_background #343f44

# ==============================================================================
# ENVIRONMENT & SHORTCUTS
# ==============================================================================
term xterm-kitty
map ctrl+shift+e kitten hints
map ctrl+shift+h show_scrollback
